document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\"color:#a39d95\">Juego<\u002Fa><a href=\"#tecnologia\" style=\"color:#a39d95\">Tecnología<\u002Fa><a href=\"#produccion\" style=\"color:#a39d95\">Producción<\u002Fa><a href=\"#referencias\" style=\"color:#a39d95\">Referencias<\u002Fa><a href=\"#enlaces\" style=\"color:#a39d95\">Enlaces<\u002Fa>\n  <\u002Fnav>\n<\u002Fdiv>\n\n<main style=\"max-width:1280px;margin:0 auto;padding:clamp(64px,10vw,140px) clamp(16px,4vw,48px) 120px;display:flex;flex-direction:column;gap:clamp(96px,12vw,160px)\">\n\n<header style=\"display:flex;flex-direction:column;gap:28px\">\n  <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#a39d95\">Archivo maestro · Corte 5 de noviembre de 2026<\u002Fspan>\n  <h1 style=\"margin:0;font-family:'Big Shoulders Display',sans-serif;font-weight:900;text-transform:uppercase;line-height:.88;font-size:clamp(64px,12vw,180px)\">Anexo<\u002Fh1>\n  <p style=\"margin:0;font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(24px,2.6vw,34px);line-height:1.25;max-width:880px;text-wrap:pretty\">Todo lo que sostiene la visión: decisiones, exploraciones, tecnología, producción y las 25 referencias.<\u002Fp>\n  <p style=\"margin:0;font-size:15px;line-height:1.65;color:#a39d95;max-width:760px;text-wrap:pretty\">Reúne documentación original, información de las conversaciones del proyecto, texto y notas de los PowerPoints y reconstrucciones identificadas como tales. No es una exportación literal de todos los chats; no se fabrican frases, decisiones ni respuestas ausentes.<\u002Fp>\n  <div style=\"display:flex;flex-wrap:wrap;gap:8px;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.08em\">\n    <sc-for list=\"{{ conventions }}\" as=\"c\" hint-placeholder-count=\"7\">\n      <span style=\"border:1px solid rgba(239,235,228,.2);padding:6px 10px;color:#c9c3ba\" title=\"{{ c.d }}\"><span style=\"color:#efebe4\">{{ c.t }}<\u002Fspan> {{ c.d }}<\u002Fspan>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<sc-for list=\"{{ sections }}\" as=\"sec\" hint-placeholder-count=\"6\">\n  <section id=\"{{ sec.id }}\" style=\"display:flex;flex-direction:column;gap:32px\">\n    <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:24px;border-bottom:1px solid rgba(239,235,228,.14);padding-bottom:14px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase\">\n      <span>{{ sec.k }}<\u002Fspan><span style=\"color:#a39d95\">{{ sec.tag }}<\u002Fspan>\n    <\u002Fdiv>\n    <h2 style=\"margin:0;font-family:'Big Shoulders Display',sans-serif;font-weight:900;text-transform:uppercase;line-height:.9;font-size:clamp(44px,6vw,96px)\">{{ sec.title }}<\u002Fh2>\n    <sc-for list=\"{{ sec.groups }}\" as=\"g\" hint-placeholder-count=\"2\">\n      <div style=\"display:flex;flex-wrap:wrap;gap:24px 48px;padding-top:12px\">\n        <div style=\"display:flex;flex-direction:column;gap:10px;flex:1 1 240px\">\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#a39d95\">{{ g.h }}<\u002Fspan>\n          <span style=\"font-size:14px;line-height:1.6;color:#a39d95;text-wrap:pretty\">{{ g.note }}<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;flex:2 1 520px;min-width:0\">\n          <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"4\">\n            <div style=\"display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:20px;padding:16px 0;border-top:1px solid rgba(239,235,228,.12)\">\n              <span style=\"font-weight:600;font-size:15px;line-height:1.45\">{{ it.t }}<\u002Fspan>\n              <span style=\"font-size:15px;line-height:1.6;color:#c9c3ba;text-wrap:pretty\">{{ it.d }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fsection>\n<\u002Fsc-for>\n\n<section id=\"tecnologia-tabla\" style=\"display:flex;flex-direction:column;gap:24px\">\n  <div style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#a39d95\">Herramientas exploradas · no aprobadas<\u002Fdiv>\n  <div style=\"overflow-x:auto\">\n    <div style=\"min-width:760px;display:flex;flex-direction:column\">\n      <div style=\"display:grid;grid-template-columns:1.2fr 1.4fr 1.4fr;gap:20px;padding:12px 0;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;color:#a39d95;border-bottom:1px solid rgba(239,235,228,.2)\"><span>RECURSO<\u002Fspan><span>USO PROPUESTO<\u002Fspan><span>OBSERVACIONES<\u002Fspan><\u002Fdiv>\n      <sc-for list=\"{{ tools }}\" as=\"d\" hint-placeholder-count=\"9\">\n        <div style=\"display:grid;grid-template-columns:1.2fr 1.4fr 1.4fr;gap:20px;padding:14px 0;border-bottom:1px solid rgba(239,235,228,.1);font-size:14px;line-height:1.45;color:#c9c3ba\">\n          <span style=\"color:#efebe4;font-weight:500\">{{ d.t }}<\u002Fspan><span>{{ d.s }}<\u002Fspan><span>{{ d.n }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"decisiones\" style=\"display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:24px;border-bottom:1px solid rgba(239,235,228,.14);padding-bottom:14px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase\">\n    <span>Registro<\u002Fspan><span style=\"color:#a39d95\">Estado al 05/11/2026<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"margin:0;font-family:'Big Shoulders Display',sans-serif;font-weight:900;text-transform:uppercase;line-height:.9;font-size:clamp(44px,6vw,96px)\">Decisiones y pendientes<\u002Fh2>\n  <div style=\"overflow-x:auto\">\n    <div style=\"min-width:720px;display:flex;flex-direction:column\">\n      <div style=\"display:grid;grid-template-columns:1.2fr 1.4fr 1.6fr;gap:20px;padding:12px 0;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;color:#a39d95;border-bottom:1px solid rgba(239,235,228,.2)\"><span>TEMA<\u002Fspan><span>ESTADO<\u002Fspan><span>PRÓXIMO PASO<\u002Fspan><\u002Fdiv>\n      <sc-for list=\"{{ decisions }}\" as=\"d\" hint-placeholder-count=\"18\">\n        <div style=\"display:grid;grid-template-columns:1.2fr 1.4fr 1.6fr;gap:20px;padding:14px 0;border-bottom:1px solid rgba(239,235,228,.1);font-size:14px;line-height:1.45;color:#c9c3ba\" style-hover=\"background:#141212\">\n          <span style=\"color:#efebe4;font-weight:500\">{{ d.t }}<\u002Fspan><span>{{ d.s }}<\u002Fspan><span>{{ d.n }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"referencias\" style=\"display:flex;flex-direction:column;gap:28px\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:24px;border-bottom:1px solid rgba(239,235,228,.14);padding-bottom:14px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase\">\n    <span>Anexo A<\u002Fspan><span style=\"color:#a39d95\">18 de octubre de 2026 · revisión visual parcial<\u002Fspan>\n  <\u002Fdiv>\n  <h2 style=\"margin:0;font-family:'Big Shoulders Display',sans-serif;font-weight:900;text-transform:uppercase;line-height:.9;font-size:clamp(44px,6vw,96px)\">25 referencias creativas<\u002Fh2>\n  <p style=\"margin:0;font-family:'Instrument Serif',serif;font-style:italic;font-size:26px;line-height:1.3;max-width:900px;text-wrap:pretty\">El hilo más fértil es convertir algo invisible en una experiencia tangible: movimiento en partículas, sonido en luz, datos en forma, voz en papel.<\u002Fp>\n  <p style=\"margin:0;font-size:15px;line-height:1.65;color:#a39d95;max-width:820px;text-wrap:pretty\">Se abrieron los 25 enlaces y se consultaron sus textos públicos y escenas visibles. Las capturas acreditan escenas puntuales; no prueban por sí solas movimiento, reactividad, estabilidad o funcionamiento del hardware. Familias: participativas con acción legible (09, 11, 15, 22), atmósferas compartidas (03, 17, 20, 21), objetos de cerca (01, 04, 05, 10, 18, 23, 24); 07, 08, 12 y 14 sirven a curaduría, identidad y comunicación.<\u002Fp>\n  <div style=\"display:flex;flex-direction:column\">\n    <sc-for list=\"{{ refs }}\" as=\"r\" hint-placeholder-count=\"25\">\n      <div style=\"display:grid;grid-template-columns:40px minmax(180px,1.1fr) minmax(200px,2fr) 80px;gap:20px;align-items:baseline;padding:18px 0;border-top:1px solid rgba(239,235,228,.12)\">\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;color:#a39d95\">{{ r.n }}<\u002Fspan>\n        <div style=\"display:flex;flex-direction:column;gap:4px\">\n          <a href=\"{{ r.u }}\" target=\"_blank\" style=\"font-weight:600;font-size:16px\" style-hover=\"color:#ff6b4a\">{{ r.t }} ↗<\u002Fa>\n          <span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#a39d95\">{{ r.a }}<\u002Fspan>\n        <\u002Fdiv>\n        <span style=\"font-size:14px;line-height:1.55;color:#c9c3ba;text-wrap:pretty\">{{ r.d }}<\u002Fspan>\n        <span style=\"font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:.1em;text-align:right;color:{{ r.c }}\">{{ r.p }}<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"enlaces\" style=\"display:flex;flex-direction:column;gap:24px\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:24px;border-bottom:1px solid rgba(239,235,228,.14);padding-bottom:14px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase\">\n    <span>Archivos<\u002Fspan><span style=\"color:#a39d95\">Enlaces conocidos<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1px;background:rgba(239,235,228,.14);border:1px solid rgba(239,235,228,.14)\">\n    <a href=\"https://drive.google.com/drive/folders/1QrAh8oNwSbFjuq3S24GVMJ5SENqKiO7q\" target=\"_blank\" style=\"background:#0a0909;padding:24px;display:flex;flex-direction:column;gap:8px\" style-hover=\"background:#151313\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#a39d95\">GOOGLE DRIVE<\u002Fspan><span style=\"font-weight:600\">Encounter Fest — Creative References ↗<\u002Fspan><\u002Fa>\n    <a href=\"https://docs.google.com/document/d/14mVicm5z4A5nm0pwCL86SazgT_bXWjBw4BQJ0c9fuKg/edit?usp=drivesdk\" target=\"_blank\" style=\"background:#0a0909;padding:24px;display:flex;flex-direction:column;gap:8px\" style-hover=\"background:#151313\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#a39d95\">GOOGLE DOCS<\u002Fspan><span style=\"font-weight:600\">Análisis de 25 referencias ↗<\u002Fspan><\u002Fa>\n    <a href=\"https://drive.google.com/drive/folders/1smwR59omP6kyYcvEjRJ-SZyNWegknuNI\" target=\"_blank\" style=\"background:#0a0909;padding:24px;display:flex;flex-direction:column;gap:8px\" style-hover=\"background:#151313\"><span style=\"font-family:'JetBrains Mono',monospace;font-size:11px;color:#a39d95\">GOOGLE DRIVE<\u002Fspan><span style=\"font-weight:600\">Carpeta de 25 capturas ↗<\u002Fspan><\u002Fa>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:10px;font-size:14px;line-height:1.6;color:#a39d95\">\n    <span>Presentaciones examinadas: Encounter — THE UNSEEN.pptx (10 slides) · Encounter_THE_UNSEEN_Pitch_Liderazgo.pptx (13 slides) · Encounter_THE_UNSEEN_Master_Pitch_36_slides.pptx (36 slides, notas).<\u002Fspan>\n    <span>Mencionados pero no recuperados: Encounter_Fest_Conversacion_Completa.md · encounter_one_body_charla_completa.md. Sus ideas se conservan mediante reconstrucción, no transcripción.<\u002Fspan>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<footer style=\"display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;padding-top:40px\">\n  <p style=\"margin:0;font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(26px,3vw,40px);line-height:1.25;max-width:900px;text-wrap:balance\">No sacrificar magia, originalidad, profundidad, tecnología, juego o música para hacer el pitch corto; separar visión total de producción escalable.<\u002Fp>\n  <span style=\"font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.14em;color:#a39d95\">ÚLTIMA REGLA DEL PROYECTO<\u002Fspan>\n  <a href=\"Encounter The Unseen v2.dc.html\" style=\"margin-top:20px;font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.12em;border:1px solid rgba(239,235,228,.3);padding:12px 20px\">← VOLVER A LA VISIÓN<\u002Fa>\n<\u002Ffooter>\n\n<\u002Fmain>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() {\n    const L = a => a.map(x => ({ t: x[0], d: x[1] }));\n    const P = { ALTA: '#efebe4', MEDIA: '#a39d95', BAJA: '#6f6a64' };\n    const refs = [\n      ['Hoverboard experimental','aprotohype','MEDIA','Dentl5ZNJWK','reel','Mesa «¿cómo siente una máquina?» con sensor de inclinación y visualización ampliada. No prometer una tabla voladora.'],\n      ['Pickup como impresora matricial','ryder_calm_down','BAJA','Dd02AlqphYG','reel','Plotter móvil en área delimitada que componga mensajes colectivos. Falta video completo y mecanismo.'],\n      ['Musica Subsonica 0.1','filipborelli.art','ALTA','DbyJRZGMfuO','reel','«La memoria sonora del lugar»: interpretación acústica visible del recinto. Media/alta, obra comisionada.'],\n      ['ESP-FLUTTER — mariposa biónica','max.imagination','MEDIA','Del-mSfSnjF','reel','«Jardín de especies futuras»: piezas suspendidas con movimiento de alas; versión fija primero.'],\n      ['Digital Rain Ring','danielidle','MEDIA','DehoObDo4cI','reel','Vestuario para anfitriones o vitrina de joyería digital con animaciones de Encounter.'],\n      ['CAPTURE/RESEMBLE','riqueinglez.art · Andreas Lu ],\n      ['Boris Acket / Fred again USB002','ikm.films','ALTA','DcV0h9AMH8y','reel','«Cielo compartido»: membrana iluminada sobre zona de encuentro. Complejidad alta de producción.'],\n      ['Levitación acústica','menteprompt','MEDIA','Dd9gM0ziD0F','p','«Materia suspendida»: mesa guiada con cámara macro y pantalla. No prometer objetos grandes.'],\n      ['Reel narrativo con periódico','matiasjafif','MEDIA','DeC7ADnRBtA','reel','Diario personalizado con agenda y aportes del público. No atribuir el método a IA sin evidencia.'],\n      ['The Day We Left Field','wearetundra','ALTA','DcRQlw7s4wM','reel','«Pradera invertida»: área contemplativa entre actividades intensas, con materialidad propia.'],\n      ['Dissonance','formundrausch','MEDIA','Dc_VcxsMQax','reel','Composición de monitores o cajas de luz con fragmentos de paisaje en el foyer. Confirmar si es físico.'],\n      ['Reflexiones habladas convertidas en impresos','googlefordevs · googlegemini','ALTA','Dd9r1_tkeq4','reel','«Me llevo este encuentro»: una respuesta produce un ticket ilustrado; borrado de audio y alternativa escrita.'],\n      ['Ode Minérale','cantouchthis.studio · olgamaximova','ALTA','DdlktaBurUF','reel','«Orquesta de materia»: piedras y materiales tocables con captación; estaciones por turnos.'],\n      ['Phone booth de pared','nickydavis','ALTA','DbEKX78tmBG','reel','«Estación de presencia»: soportes visibles en zona de conversación; gesto voluntario.'],\n      ['Diseño sonoro de una imagen luminosa','dipprrrrrrrrrrrr · meanreal_jacklee','MEDIA','DQUstbZj1vu','reel','Microperformances de sonido o taller de sonificación; probar el vínculo señal-imagen en vivo.']\n    ].map((r, i) => ({ n: String(i + 1).padStart(2, '0'), t: r[0], a: r[1], p: r[2], c: P[r[2]], u: `https://www.instagram.com/${r[4]}/${r[3]}/`, d: r[5] }));\n    return {\n      conventions: L([['[USUARIO]','criterio de Niko'],['[IDEA]','propuesta explorada'],['[DECISIÓN DE TRABAJO]','dirección adoptada'],['[ABIERTO]','falta decisión
